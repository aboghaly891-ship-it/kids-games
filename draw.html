<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 لعبة الرسم - القط الرسام</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(160deg,#fce4ec,#e3f2fd);display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh}
h1{font-size:22px;color:#2c3e50;margin:8px 0}
.top-bar{display:flex;gap:10px;background:#fff;padding:8px 16px;border-radius:20px;box-shadow:0 3px 8px rgba(0,0,0,.08);margin-bottom:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.top-bar .stat{font-size:16px;font-weight:bold;color:#2c3e50}
.top-bar .value{color:#f39c12}
.small-btn{color:#fff;border:none;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.small-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.next-btn{background:#2ecc71;box-shadow:0 3px 0 #27ae60}
.reset-btn{background:#e74c3c;box-shadow:0 3px 0 #c0392b}

.game{background:#fff;border-radius:24px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-width:520px;width:100%}
.level-info{text-align:center;margin-bottom:10px}
.level-info h2{margin:0;font-size:18px;color:#2c3e50}
.level-info p{margin:4px 0;font-size:15px;color:#7f8c8d;font-weight:bold}

.canvas-wrap{position:relative;display:flex;justify-content:center;margin-bottom:12px}
canvas{background:#fafafa;border:3px dashed #bdc3c7;border-radius:16px;display:block;max-width:100%;touch-action:none}
.target-hint{position:absolute;top:8px;left:8px;font-size:12px;color:#95a5a6;background:#fff;padding:3px 8px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}

.controls{display:flex;flex-direction:column;gap:10px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cmd-btn{background:#4a90e2;color:#fff;border:none;border-radius:16px;padding:14px 18px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #2c5aa0;min-width:60px;min-height:56px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.cmd-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2c5aa0}
.cmd-btn.draw{background:#4a90e2;box-shadow:0 5px 0 #2c5aa0}
.cmd-btn.right{background:#f39c12;box-shadow:0 5px 0 #b87e0e}
.cmd-btn.left{background:#27ae60;box-shadow:0 5px 0 #1e8449}
.cmd-btn.repeat{background:#9b59b6;box-shadow:0 5px 0 #7d3c98;padding:14px 20px;font-size:18px}
.cmd-btn.clear{background:#e74c3c;box-shadow:0 5px 0 #c0392b;font-size:18px;padding:12px 20px}

.program{background:#f8f9fa;border:3px dashed #bdc3c7;border-radius:15px;min-height:60px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%}
.program-item{background:#fff;border:2px solid #4a90e2;border-radius:10px;padding:6px 10px;font-size:20px;display:flex;align-items:center;gap:4px;cursor:pointer;min-height:36px}
.program-item.right{border-color:#f39c12}
.program-item.left{border-color:#27ae60}
.repeat-badge{background:#9b59b6;color:#fff;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:bold}

.run-btn{background:#2ecc71;color:#fff;border:none;border-radius:20px;padding:14px 40px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #27ae60}
.run-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #27ae60}

.feedback{font-size:18px;font-weight:bold;color:#27ae60;text-align:center;min-height:26px;margin-top:8px}

.win-overlay{position:fixed;inset:0;background:rgba(46,204,113,.9);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.win-card{background:#fff;border-radius:25px;padding:30px 40px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:400px}
.win-card h2{font-size:30px;color:#27ae60;margin:0 0 10px}
.win-card .emoji{font-size:60px;margin:10px 0}
.win-card button{background:#2ecc71;color:#fff;border:none;border-radius:20px;padding:14px 30px;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #27ae60;margin:5px}
.win-card .retry{background:#3498db;box-shadow:0 5px 0 #2980b9}
.star{position:fixed;font-size:36px;pointer-events:none;z-index:1000;animation:starFly 1.8s ease-out forwards}
@keyframes starFly{0%{transform:translateY(0) rotate(0) scale(.3);opacity:0}20%{opacity:1;transform:translateY(-30px) rotate(30deg) scale(1.2)}100%{transform:translateY(-250px) rotate(360deg) scale(.6);opacity:0}}
@media (max-width: 600px) {
  body{padding:8px}
  h1{font-size:20px;text-align:center}
  .top-bar{width:100%;max-width:520px;gap:8px;padding:8px 10px}
  .top-bar .stat{font-size:14px}
  .small-btn{padding:8px 10px;font-size:13px}
  .game{width:100%;padding:clamp(12px,4vw,16px);border-radius:18px}
  .level-info h2{font-size:17px}
  .level-info p{font-size:14px}
  .canvas-wrap{width:100%;min-width:0}
  canvas{width:100%;max-width:420px;height:auto}
  .controls{width:100%;gap:9px}
  .row{width:100%;gap:6px}
  .row:first-child{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .row:nth-child(2){display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .cmd-btn{width:100%;min-width:0;min-height:50px;padding:10px 6px;font-size:clamp(18px,5vw,22px)}
  .cmd-btn.repeat{padding:10px 4px;font-size:clamp(15px,4.5vw,18px)}
  .cmd-btn.clear{padding:10px 4px;font-size:18px}
  .program{min-height:56px;padding:7px}
  .program-item{min-height:34px;padding:5px 8px;font-size:16px}
  .run-btn{width:min(100%,300px);padding:12px 20px;font-size:20px}
  .feedback{font-size:16px}
  .win-card{width:min(100%,400px);padding:24px 18px}
  .win-card h2{font-size:26px}
  .win-card button{padding:12px 18px;font-size:18px}
}
@media (max-width: 360px) {
  body{padding:6px}
  .top-bar .stat{font-size:13px}
  .small-btn{padding:7px 8px;font-size:12px}
  .game{padding:10px}
  .program-item{padding:5px 7px;font-size:15px}
}
</style>
</head>
<body>
<h1>🎨 القط الرسام</h1>

<div class="top-bar">
  <div class="stat">⭐ <span class="value" id="stars">0</span></div>
  <div class="stat">🏆 <span class="value" id="levelNum">1</span></div>
  <button class="small-btn next-btn" onclick="nextLevel()">➡️ التالي</button>
  <button class="small-btn reset-btn" onclick="resetAll()">🔄 من الأول</button>
</div>

<div class="game">
  <div class="level-info">
    <h2 id="title">المستوى 1</h2>
    <p id="hint">ارسم خط!</p>
  </div>

  <div class="canvas-wrap">
    <canvas id="cv" width="420" height="420"></canvas>
    <div class="target-hint" id="targetHint"></div>
  </div>

  <div class="controls">
    <div class="row">
      <button class="cmd-btn draw" onclick="addCmd('draw')">✏️</button>
      <button class="cmd-btn right" onclick="addCmd('right')">↪️</button>
      <button class="cmd-btn left" onclick="addCmd('left')">↩️</button>
    </div>
    <div class="row">
      <button class="cmd-btn repeat" onclick="addRepeat(2)">🔁2</button>
      <button class="cmd-btn repeat" onclick="addRepeat(3)">🔁3</button>
      <button class="cmd-btn repeat" onclick="addRepeat(4)">🔁4</button>
      <button class="cmd-btn clear" onclick="clearDrawing()">🧹</button>
    </div>
    <div class="program" id="program"></div>
    <button class="run-btn" onclick="run()">▶️ شغّل</button>
    <div class="feedback" id="fb"></div>
  </div>
</div>

<script>
const THEMES = ['🐱','🐰','🐶','🐼','🦊','🐨','🐸','🐯','🦁','🐷'];
const STEP = 60;

const levels = [
  { title:"المستوى 1: خط!", hint:"✏️ مرة واحدة", theme:0, goal:function(p){ return p.lines === 1; }, target:"✏️"},
  { title:"المستوى 2: خط طويل", hint:"✏️ + 🔁3", theme:1, goal:function(p){ return p.lines === 4 && !p.hasTurned; }, target:"✏️ ✏️ ✏️ ✏️"},
  { title:"المستوى 3: زاوية", hint:"✏️ ✏️ ↪️ ✏️ ✏️", theme:2, goal:function(p){ return p.lines === 4 && p.turns === 1; }, target:"L شكل"},
  { title:"المستوى 4: المربع", hint:"✏️ + 🔁4 ثم ↪️، كررها 4 مرات!", theme:3, goal:function(p){ return p.lines >= 16 && p.closedSquare; }, target:"◻️"},
  { title:"المستوى 5: المثلث", hint:"✏️ ✏️ ثم ↪️ — 3 مرات", theme:4, goal:function(p){ return p.lines >= 12 && p.turns >= 6; }, target:"△"},
  { title:"المستوى 6: نجمة", hint:"جرّب تكرار 8 مرات: ✏️ ثم ↪️", theme:5, goal:function(p){ return p.lines >= 20; }, target:"⭐"}
];

let currentLevel = 0;
let stars = 0;
let program = [];
let isRunning = false;
let char = { x:0, y:0, angle:-90 };
let path = [];
let lineCount = 0;
let turnCount = 0;
let lastPoint = null;
let firstPoint = null;
let audioCtx = null;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function initChar() {
  char.x = cv.width / 2;
  char.y = cv.height / 2;
  char.angle = -90;
  path = [];
  lineCount = 0;
  turnCount = 0;
  lastPoint = { x: char.x, y: char.y };
  firstPoint = { x: char.x, y: char.y };
}

function drawBoard() {
  ctx.clearRect(0, 0, cv.width, cv.height);

  // شبكة خفيفة
  ctx.strokeStyle = '#eef2f5';
  ctx.lineWidth = 1;
  for (let i = 0; i <= cv.width; i += 60) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(cv.width, i); ctx.stroke();
  }

  // المسار
  if (path.length > 0) {
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);
    for (let i = 1; i < path.length; i++) {
      ctx.lineTo(path[i].x, path[i].y);
    }
    ctx.stroke();
  }

  // القط
  const theme = levels[currentLevel].theme;
  const emoji = THEMES[theme] || '🐱';
  ctx.font = '44px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, char.x, char.y);

  // سهم الاتجاه
  const rad = char.angle * Math.PI / 180;
  const ax = char.x + Math.cos(rad) * 34;
  const ay = char.y + Math.sin(rad) * 34;
  ctx.fillStyle = '#f39c12';
  ctx.beginPath();
  ctx.arc(ax, ay, 6, 0, Math.PI * 2);
  ctx.fill();
}

function addCmd(type) {
  if (isRunning) return;
  playClick();
  program.push({ type: type, repeat: 1 });
  renderProgram();
}

function addRepeat(n) {
  if (isRunning) return;
  if (program.length === 0) { feedback('🤔 أضف أمر أولاً'); return; }
  program[program.length - 1].repeat = n;
  playClick();
  renderProgram();
}

function renderProgram() {
  const p = document.getElementById('program');
  p.innerHTML = '';
  program.forEach(function(cmd, idx) {
    const it = document.createElement('div');
    it.className = 'program-item ' + cmd.type;
    let label = cmd.type === 'draw' ? '✏️' : (cmd.type === 'right' ? '↪️' : '↩️');
    let html = label;
    if (cmd.repeat > 1) html += ' <span class="repeat-badge">×' + cmd.repeat + '</span>';
    it.innerHTML = html;
    it.onclick = function() {
      if (isRunning) return;
      program.splice(idx, 1);
      renderProgram();
    };
    p.appendChild(it);
  });
}

function feedback(msg) {
  document.getElementById('fb').textContent = msg;
}

function playClick() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.value = 600;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
  o.start(); o.stop(audioCtx.currentTime + 0.05);
}

function playTone(freq, dur, delay, type, vol) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (delay === undefined) delay = 0;
  if (type === undefined) type = 'sine';
  if (vol === undefined) vol = 0.15;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + delay;
  o.start(t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.stop(t + dur);
}

function execute(type) {
  if (type === 'draw') {
    const rad = char.angle * Math.PI / 180;
    const nx = char.x + Math.cos(rad) * STEP;
    const ny = char.y + Math.sin(rad) * STEP;
    if (nx < 20 || nx > cv.width - 20 || ny < 20 || ny > cv.height - 20) {
      feedback('🙈 خارج اللوحة!');
      playTone(200, 0.2, 0, 'sawtooth', 0.2);
      return 'fail';
    }
    char.x = nx; char.y = ny;
    path.push({ x: char.x, y: char.y });
    lineCount++;
    playTone(400 + lineCount * 20, 0.08, 0, 'sine', 0.1);
  } else if (type === 'right') {
    char.angle += 90;
    turnCount++;
    playTone(600, 0.06, 0, 'triangle', 0.1);
  } else if (type === 'left') {
    char.angle -= 90;
    turnCount++;
    playTone(500, 0.06, 0, 'triangle', 0.1);
  }
  drawBoard();
  return 'ok';
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

async function run() {
  if (isRunning) return;
  if (program.length === 0) { feedback('🤔 أضف أوامر أولاً!'); return; }
  isRunning = true;
  feedback('');
  // إعادة تعيين الرسم
  path = [];
  lineCount = 0;
  turnCount = 0;
  const savedX = char.x, savedY = char.y, savedAngle = char.angle;
  initChar();
  drawBoard();

  outer:
  for (let i = 0; i < program.length; i++) {
    const cmd = program[i];
    for (let r = 0; r < cmd.repeat; r++) {
      const res = execute(cmd.type);
      await sleep(250);
      if (res === 'fail') { isRunning = false; return; }
    }
  }
  isRunning = false;
  checkWin();
}

function checkWin() {
  const p = { lines: lineCount, turns: turnCount, hasTurned: turnCount > 0, closedSquare: false };
  // كشف المربع: 16 خط + آخر نقطة قريبة من أول نقطة
  if (path.length > 0) {
    const last = path[path.length - 1];
    if (Math.abs(last.x - firstPoint.x) < 15 && Math.abs(last.y - firstPoint.y) < 15) {
      p.closedSquare = true;
    }
  }
  if (levels[currentLevel].goal(p)) {
    win();
  } else {
    feedback('🤔 جرّب تاني — الهدف: ' + levels[currentLevel].target);
  }
}

function win() {
  stars += 3;
  document.getElementById('stars').textContent = stars;
  playTone(523, 0.15, 0, 'triangle', 0.15);
  playTone(659, 0.15, 0.15, 'triangle', 0.15);
  playTone(784, 0.25, 0.30, 'triangle', 0.15);
  playTone(1047, 0.4, 0.55, 'triangle', 0.15);
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.textContent = ['⭐','🌟','✨','💫'][Math.floor(Math.random()*4)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = (60 + Math.random() * 30) + 'vh';
    s.style.animationDelay = (Math.random() * 0.6) + 's';
    s.style.fontSize = (25 + Math.random() * 30) + 'px';
    document.body.appendChild(s);
    setTimeout(function() { s.remove(); }, 2500);
  }
  setTimeout(function() {
    const o = document.createElement('div');
    o.className = 'win-overlay';
    o.innerHTML = '<div class="win-card"><h2>🎉 برافو! 🎉</h2><div class="emoji">' + THEMES[levels[currentLevel].theme] + '🎨</div><div style="font-size:36px">⭐⭐⭐</div><p style="font-size:18px;color:#2c3e50">رسمت ' + levels[currentLevel].target + '!</p><button class="retry" onclick="closeWin(); clearDrawing();">🔄 تاني</button><button onclick="closeWin(); nextLevel();">➡️ التالي</button></div>';
    document.body.appendChild(o);
  }, 500);
}

function closeWin() {
  const o = document.querySelector('.win-overlay');
  if (o) o.remove();
}

function nextLevel() {
  closeWin();
  if (currentLevel < levels.length - 1) {
    currentLevel++;
    loadLevel();
  } else {
    feedback('🎉 خلصت كل المستويات!');
  }
}

function resetAll() {
  closeWin();
  currentLevel = 0;
  stars = 0;
  document.getElementById('stars').textContent = 0;
  loadLevel();
}

function clearDrawing() {
  closeWin();
  program = [];
  renderProgram();
  initChar();
  drawBoard();
  feedback('');
}

function loadLevel() {
  const lv = levels[currentLevel];
  document.getElementById('title').textContent = lv.title;
  document.getElementById('hint').textContent = lv.hint;
  document.getElementById('levelNum').textContent = currentLevel + 1;
  document.getElementById('targetHint').textContent = '🎯 ' + lv.target;
  program = [];
  renderProgram();
  initChar();
  drawBoard();
  feedback('');
}

window.addCmd = addCmd;
window.addRepeat = addRepeat;
window.run = run;
window.nextLevel = nextLevel;
window.resetAll = resetAll;
window.clearDrawing = clearDrawing;
window.closeWin = closeWin;

loadLevel();
</script>
</body>
</html>
