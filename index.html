<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 صالة الألعاب التعليمية</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,sans-serif;
  background:linear-gradient(160deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
  position:relative;
}
.bg-star{
  position:fixed;
  color:rgba(255,255,255,.4);
  font-size:20px;
  animation:float 6s ease-in-out infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-20px) rotate(180deg)}
}
.container{
  max-width:900px;
  width:100%;
  position:relative;
  z-index:1;
  text-align:center;
}
.title{
  color:#fff;
  font-size:clamp(28px,6vw,42px);
  font-weight:900;
  margin-bottom:8px;
  text-shadow:0 4px 12px rgba(0,0,0,.3);
  animation:bounceIn .8s ease;
}
@keyframes bounceIn{
  0%{opacity:0;transform:scale(.3)}
  60%{transform:scale(1.1)}
  100%{opacity:1;transform:scale(1)}
}
.subtitle{
  color:rgba(255,255,255,.95);
  font-size:clamp(14px,3vw,18px);
  margin-bottom:30px;
  font-weight:600;
  text-shadow:0 2px 6px rgba(0,0,0,.2);
}
.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:10px;
}
.game-card{
  background:#fff;
  border-radius:26px;
  padding:28px 20px;
  text-decoration:none;
  color:#2c3e50;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
  transition:all .3s ease;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  border:4px solid transparent;
}
.game-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:6px;
  background:var(--accent,#4a90e2);
  border-radius:26px 26px 0 0;
}
.game-card:hover,.game-card:active{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 22px 45px rgba(0,0,0,.35);
  border-color:var(--accent,#4a90e2);
}
.game-emoji{
  font-size:72px;
  line-height:1;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));
  animation:wiggle 3s ease-in-out infinite;
}
@keyframes wiggle{
  0%,100%{transform:rotate(-3deg) scale(1)}
  50%{transform:rotate(3deg) scale(1.05)}
}
.game-title{
  font-size:22px;
  font-weight:900;
  color:#2c3e50;
  margin-top:4px;
}
.game-desc{
  font-size:14px;
  color:#7f8c8d;
  font-weight:600;
  line-height:1.5;
}
.game-btn{
  margin-top:6px;
  padding:12px 32px;
  border-radius:14px;
  color:#fff;
  font-size:17px;
  font-weight:900;
  background:var(--accent,#4a90e2);
  box-shadow:0 5px 0 rgba(0,0,0,.2);
  transition:transform .08s;
}
.game-card:active .game-btn{
  transform:translateY(3px);
  box-shadow:0 2px 0 rgba(0,0,0,.2);
}
.card-maze{--accent:#4a90e2}
.card-draw{--accent:#f39c12}
.card-lesson{--accent:#27ae60}
.footer{
  margin-top:30px;
  color:rgba(255,255,255,.85);
  font-size:14px;
  font-weight:600;
  text-shadow:0 2px 4px rgba(0,0,0,.2);
}
@media (max-width:600px){
  body{padding:16px}
  .games-grid{gap:14px;grid-template-columns:1fr}
  .game-card{padding:22px 16px;flex-direction:row;text-align:right;gap:16px;align-items:center}
  .game-emoji{font-size:56px;flex-shrink:0}
  .game-info{flex:1;display:flex;flex-direction:column;gap:4px}
  .game-title{font-size:19px;text-align:right}
  .game-desc{font-size:13px;text-align:right}
  .game-btn{padding:10px 22px;font-size:15px;align-self:flex-end;margin-top:4px}
}
</style>
</head><body>

<div class="container">
  <div class="title">🎓 صالة الألعاب التعليمية</div>
  <div class="subtitle">اختر لعبة وابدأ التعلم! 🚀</div>

  <div class="games-grid">

    <a href="maze.html" class="game-card card-maze">
      <div class="game-emoji">🐰</div>
      <div class="game-info">
        <div class="game-title">لعبة المتاهة</div>
        <div class="game-desc">وصل الحيوان للأكل بتاعه بالأسهم</div>
      </div>
      <div class="game-btn">▶️ العب</div>
    </a>

    <a href="draw.html" class="game-card card-draw">
      <div class="game-emoji">🎨</div>
      <div class="game-info">
        <div class="game-title">القط الرسام</div>
        <div class="game-desc">ارسم أشكال بالكود</div>
      </div>
      <div class="game-btn">▶️ العب</div>
    </a>

    <a href="lesson.html" class="game-card card-lesson">
      <div class="game-emoji">📚</div>
      <div class="game-info">
        <div class="game-title">الدرس 1</div>
        <div class="game-desc">يعني إيه "أمر"؟</div>
      </div>
      <div class="game-btn">🎓 اتعلم</div>
    </a>

  </div>

  <div class="footer">🌟 العب واتعلم البرمجة 🌟</div>
</div>
<script>
(function(){
  const stars = ['⭐','✨','🌟','💫'];
  for(let i=0;i<15;i++){
    const s = document.createElement('div');
    s.className = 'bg-star';
    s.textContent = stars[Math.floor(Math.random()*stars.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.fontSize = (15+Math.random()*20) + 'px';
    s.style.animationDelay = Math.random()*3 + 's';
    document.body.appendChild(s);
  }
})();
</script>

</body>
</html>
