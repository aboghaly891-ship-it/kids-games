<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4a90e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>لعبة البرمجة للأطفال</title>
<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#f0f7ff;display:flex;flex-direction:column;align-items:center;padding:10px;min-height:100vh;overflow-x:hidden}
h1{font-size:22px;color:#2c3e50;margin:8px 0}
.top-bar{display:flex;align-items:center;gap:8px;background:#fff;padding:6px 14px;border-radius:20px;box-shadow:0 3px 8px rgba(0,0,0,.08);margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.top-bar .stat{font-size:15px;font-weight:bold;color:#2c3e50;display:flex;align-items:center;gap:4px}
.top-bar .stat .value{color:#f39c12}
.small-btn{color:#fff;border:none;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.small-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.editor-btn{background:#8e44ad;box-shadow:0 3px 0 #6c3483}
.reset-progress-btn{background:#e74c3c;box-shadow:0 3px 0 #c0392b}
.album-btn{background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 3px 0 #4c3575}
.progress-bar{display:flex;gap:5px;padding:8px 12px;background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(74,144,226,.12);margin-bottom:10px;flex-wrap:wrap;justify-content:center;max-width:94vw}
.progress-dot{width:38px;height:38px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #dfe6ec;cursor:pointer;filter:grayscale(1) opacity(.4);position:relative;transition:all .3s}
.progress-dot.done{background:#d5f5e3;border-color:#27ae60;filter:none}
.progress-dot.done::after{content:'✔';position:absolute;bottom:-3px;right:-3px;background:#27ae60;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.progress-dot.current{background:#fff5e1;border-color:#f39c12;filter:none;transform:scale(1.12);animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1.12)}50%{transform:scale(1.25)}}

/* الحاوية الرئيسية */
.game-wrapper{width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* قسم اللوحة */
.board-section{background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);width:100%}
.level-info{text-align:center;margin-bottom:8px}
.level-info h2{margin:0;font-size:17px;color:#2c3e50}
.level-info p{margin:3px 0 0;font-size:14px;color:#7f8c8d;font-weight:bold}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#e8ecf1;padding:6px;border-radius:14px;aspect-ratio:1;max-width:320px;margin:0 auto}
.cell{background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,30px);position:relative;aspect-ratio:1}
.cell.wall{background:#8d6e63}
.cell.carrot{background:#fff9c4}
.rabbit{font-size:clamp(22px,6.5vw,32px);position:relative;display:flex;align-items:center;justify-content:center;z-index:2}
.rabbit.jump{animation:jump .5s ease}
.rabbit.shake{animation:shake .3s ease}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.arrow{position:absolute;top:-14px;right:-14px;font-size:18px;color:#e74c3c;z-index:3}
.speech{position:absolute;top:-45px;right:-8px;background:#fff;border:3px solid #f39c12;border-radius:14px;padding:4px 10px;font-size:14px;font-weight:bold;color:#e67e22;white-space:nowrap;z-index:10}

/* صندوق البرنامج - تحت الشبكة مباشرة */
.program-box{background:#f8f9fa;border:3px dashed #bdc3c7;border-radius:15px;min-height:60px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%;max-width:500px}
.program-box .empty{color:#95a5a6;font-size:13px}
.program-item{background:#fff;border:2px solid #4a90e2;border-radius:10px;padding:6px 10px;font-size:20px;display:flex;align-items:center;gap:5px;cursor:pointer}
.program-item.up{border-color:#4a90e2}
.program-item.down{border-color:#e74c3c}
.program-item.left{border-color:#27ae60}
.program-item.right{border-color:#f39c12}
.program-item.jump{border-color:#16a085}
.repeat-badge{background:#9b59b6;color:#fff;border-radius:20px;padding:1px 7px;font-size:12px;font-weight:bold}
  /* لوحة التحكم - تحت صندوق البرنامج */
.controls-panel{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:500px}

/* صف الأسهم الأربعة */
.arrows-row{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;width:220px;height:220px;margin:0 auto}
.arrow-btn{background:transparent;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .15s;filter:drop-shadow(0 4px 6px rgba(74,144,226,.2))}
.arrow-btn:active .arrow-icon{transform:scale(.85)}
.arrow-btn:active{transform:scale(.85)}
.arrow-btn .arrow-icon{font-size:64px;line-height:1;filter:drop-shadow(0 3px 5px rgba(74,144,226,.3));opacity:1;transition:all .2s;color:#4a90e2}
.arrow-btn .arrow-icon:hover{transform:scale(1.15)}
.arrow-btn:hover .arrow-icon{opacity:1;transform:scale(1.1)}
.arrow-btn.up{grid-column:2;grid-row:1}
.arrow-btn.down{grid-column:2;grid-row:3}
.arrow-btn.left{grid-column:1;grid-row:2}
.arrow-btn.right{grid-column:3;grid-row:2}
.arrow-btn .help-q{position:absolute;top:0;right:10px;background:rgba(255,215,0,.85);color:#fff;border:1.5px solid #fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-family:inherit;z-index:3;padding:0}
.arrow-btn .help-q:active{transform:scale(.9)}
.arrow-btn .code-popup{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);background:#1e2a38;color:#50fa7b;font-family:'Courier New',monospace;font-size:12px;font-weight:bold;padding:4px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:all .3s;direction:ltr;white-space:nowrap;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.arrow-btn .code-popup.show{opacity:1}

/* صف الأوامر الإضافية (🔁 + 🦘) */
.extra-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.extra-btn{background:transparent;border:2px solid #e0e6ed;border-radius:14px;padding:8px 16px;font-size:22px;font-weight:bold;cursor:pointer;transition:all .15s;color:#2c3e50;min-width:60px;display:flex;align-items:center;justify-content:center;position:relative}
.extra-btn:active{transform:scale(.9)}
.extra-btn.repeat{border-color:#c8a2d8;color:#9b59b6}
.extra-btn.jump{border-color:#a2d8c8;color:#16a085}

/* صف أزرار التشغيل */
.run-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.run-btn{padding:14px 24px;border-radius:18px;font-size:18px;font-weight:900;cursor:pointer;border:none;color:#fff;transition:transform .1s;flex:1;min-width:100px;max-width:160px}
.run-btn:active{transform:translateY(3px)}
.run-btn-main{background:linear-gradient(135deg,#2ecc71,#27ae60);box-shadow:0 5px 0 #229954}
.run-btn-step{background:linear-gradient(135deg,#3498db,#2980b9);box-shadow:0 5px 0 #21618c}
.run-btn-reset{background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 5px 0 #922b21}

/* صف السرعة والمستوى التالي */
.bottom-row{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.speed-control{display:flex;align-items:center;gap:6px;font-size:13px;color:#7f8c8d;background:#fff;padding:8px 12px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.speed-control input{width:80px}
.next-btn{background:linear-gradient(135deg,#9b59b6,#8e44ad);color:#fff;border:none;border-radius:16px;padding:12px 20px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #6c3483;transition:transform .1s}
.next-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #6c3483}

.feedback{font-size:17px;font-weight:bold;color:#2ecc71;min-height:26px;text-align:center;padding:4px}

/* النوافذ المنبثقة */
.win-overlay{position:fixed;inset:0;background:rgba(46,204,113,.9);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.win-card{background:#fff;border-radius:25px;padding:24px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:340px}
.win-card h2{font-size:26px;color:#27ae60;margin:0 0 8px}
.win-card .win-emoji{font-size:52px;margin:8px 0}
.win-card .stars-earned{font-size:34px;margin:8px 0 14px;letter-spacing:4px}
.win-card p{font-size:16px;color:#2c3e50;margin:0 0 14px}
.win-card button{background:#2ecc71;color:#fff;border:none;border-radius:16px;padding:12px 24px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #27ae60;margin:4px}
.win-card .retry-btn{background:#3498db;box-shadow:0 4px 0 #2980b9}

.star{position:fixed;font-size:36px;pointer-events:none;z-index:1000;animation:starFly 1.8s ease-out forwards}
@keyframes starFly{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translateY(-250px) scale(.6);opacity:0}}

.hidden{display:none!important}

/* الألبوم */
.album-view{position:fixed;inset:0;background:linear-gradient(160deg,#667eea,#764ba2);z-index:998;padding:16px;overflow-y:auto}
.album-container{max-width:800px;margin:0 auto;background:#fff;border-radius:22px;padding:16px}
.album-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #f0f2f5;flex-wrap:wrap;gap:8px}
.album-header h2{margin:0;font-size:20px;color:#764ba2;font-weight:900}
.album-progress-pill{background:#764ba2;color:#fff;padding:5px 12px;border-radius:16px;font-size:12px;font-weight:bold}
.album-close{background:#e74c3c;color:#fff;border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:bold;cursor:pointer}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.album-card{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;position:relative;cursor:pointer;border:2px solid transparent}
.album-card.locked{background:#e8ecf1;border-color:#d5dae0}
.album-card.locked .animal-img{font-size:26px;filter:grayscale(1);opacity:.35}
.album-card.unlocked{background:#fff;border-color:#27ae60;box-shadow:0 3px 10px rgba(46,204,113,.2)}
.album-card.unlocked .animal-img{font-size:30px}
.album-card.unlocked .food-img{font-size:16px}
.album-card .level-num{position:absolute;top:3px;right:5px;font-size:9px;font-weight:bold;color:#7f8c8d;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:6px}
.album-card.unlocked .level-num{background:#27ae60;color:#fff}
.album-card .animal-name{font-size:9px;color:#2c3e50;font-weight:bold;margin-top:2px}

/* المحرر */
.editor-view{width:100%;max-width:700px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.editor-view h2{text-align:center;color:#8e44ad;margin:0 0 10px;font-size:18px}
.editor-layout{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.editor-grid{display:grid;grid-template-columns:repeat(5,48px);grid-template-rows:repeat(5,48px);gap:3px;background:#e0e0e0;padding:3px;border-radius:10px}
.editor-cell{background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;cursor:pointer}
.editor-cell.wall{background:#8d6e63}
.editor-cell.carrot{background:#fff9c4}
.editor-cell .arrow{position:absolute;top:-12px;right:-12px;font-size:18px;color:#e74c3c;z-index:3}
.editor-tools{display:flex;flex-direction:column;gap:10px;min-width:220px}
.tool-group{background:#f8f9fa;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tool-group h3{margin:0;font-size:14px;color:#2c3e50;text-align:center}
.tool-buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tool-btn{background:#bdc3c7;border:3px solid transparent;border-radius:10px;padding:6px 10px;font-size:20px;cursor:pointer}
.tool-btn.active{background:#f39c12;border-color:#e67e22}
.theme-btn{background:#ecf0f1;border:3px solid transparent;border-radius:10px;padding:4px 8px;font-size:20px;cursor:pointer}
.theme-btn.active{background:#f39c12;border-color:#e67e22}
.dir-btn{background:#3498db;color:#fff;border:none;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.dir-btn.active{background:#e74c3c}
.editor-inputs{display:flex;flex-direction:column;gap:6px}
.editor-inputs label{font-size:13px;font-weight:bold;color:#2c3e50}
.editor-inputs input{width:100%;padding:8px;border-radius:8px;border:2px solid #bdc3c7;font-size:14px;font-family:inherit}
.editor-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.editor-actions button{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer;border:none;color:#fff}
.save-btn{background:#27ae60}
.clear-btn{background:#e67e22}
.back-btn{background:#3498db}

@media (max-width:400px){
  .arrows-row{width:180px;height:180px}
  .arrow-btn .arrow-icon{font-size:44px}
  .run-btn{font-size:16px;padding:12px 16px}
  .program-item{font-size:17px;padding:5px 8px}
}
</style>
</head>
<body>
<h1>🐰 لعبة البرمجة للأطفال</h1>

<div class="top-bar">
  <div class="stat">⭐ <span class="value" id="totalStars">0</span></div>
  <div class="stat">🏆 <span class="value" id="currentLevelNum">1</span></div>
  <button class="small-btn album-btn" onclick="openAlbum()">📖 الألبوم</button>
  <button class="small-btn editor-btn" onclick="openEditor()">🛠️ المحرر</button>
  <button class="small-btn reset-progress-btn" onclick="confirmResetProgress()">🗑️</button>
</div>

<div class="progress-bar" id="progressBar"></div>

<div class="game-wrapper" id="gameView">

  <div class="board-section">
    <div class="level-info">
      <h2 id="levelTitle">المستوى 1</h2>
      <p id="levelHint">اضغط على الأسهم ثم شغّل</p>
    </div>
    <div class="board" id="board"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="program-box" id="program">
    <span class="empty">👇 اضغط على الأسهم عشان تبني البرنامج</span>
  </div>

  <div class="controls-panel">

    <div class="arrows-row">
  <button class="arrow-btn up" onclick="addCommand('up')">
    <span class="help-q" onclick="event.stopPropagation(); showCode(this, 'up()')">؟</span>
    <span class="arrow-icon">⬆️</span>
    <span class="code-popup">up()</span>
  </button>
  <button class="arrow-btn right" onclick="addCommand('right')">
    <span class="help-q" onclick="event.stopPropagation(); showCode(this, 'right()')">؟</span>
    <span class="arrow-icon">➡️</span>
    <span class="code-popup">right()</span>
  </button>
  <button class="arrow-btn left" onclick="addCommand('left')">
    <span class="help-q" onclick="event.stopPropagation(); showCode(this, 'left()')">؟</span>
    <span class="arrow-icon">⬅️</span>
    <span class="code-popup">left()</span>
  </button>
  <button class="arrow-btn down" onclick="addCommand('down')">
    <span class="help-q" onclick="event.stopPropagation(); showCode(this, 'down()')">؟</span>
    <span class="arrow-icon">⬇️</span>
    <span class="code-popup">down()</span>
  </button>
</div>>

    <div class="extra-row">
      <button class="extra-btn repeat" onclick="addRepeat(2)">🔁2</button>
      <button class="extra-btn repeat" onclick="addRepeat(3)">🔁3</button>
      <button class="extra-btn repeat" onclick="addRepeat(4)">🔁4</button>
      <button class="extra-btn jump" onclick="addCommand('jump')">🦘</button>
    </div>

    <div class="run-row">
      <button class="run-btn run-btn-main" onclick="runProgram()">▶️ شغّل</button>
      <button class="run-btn run-btn-step" onclick="stepProgram()">👣 خطوة</button>
      <button class="run-btn run-btn-reset" onclick="resetLevel()">🔄 إعادة</button>
    </div>

    <div class="bottom-row">
      <div class="speed-control">
        <label>⚡ السرعة:</label>
        <input type="range" id="speed" min="100" max="1000" value="500" step="100">
      </div>
      <button class="next-btn" onclick="nextLevel()">➡️ التالي</button>
    </div>

  </div>

</div>

<div class="album-view hidden" id="albumView">
  <div class="album-container">
    <div class="album-header">
      <h2>📖 ألبوم الحيوانات</h2>
      <div class="album-progress-pill" id="albumProgressPill">0 / 20</div>
      <button class="album-close" onclick="closeAlbum()">✕ إغلاق</button>
    </div>
    <div class="album-grid" id="albumGrid"></div>
  </div>
</div>

<div class="editor-view hidden" id="editorView">
  <h2>🛠️ محرر المستويات</h2>
  <p style="text-align:center;color:#7f8c8d;font-size:13px;margin:0 0 10px">اختر الحيوان، ثم أداة، ثم دوس على الخلية</p>
  <div class="editor-layout">
    <div><div class="editor-grid" id="editorGrid"></div></div>
    <div class="editor-tools">
      <div class="tool-group">
        <h3>اختر الحيوان</h3>
        <div class="tool-buttons" id="themeButtons"></div>
      </div>
      <div class="tool-group">
        <h3>الأدوات</h3>
        <div class="tool-buttons">
          <button class="tool-btn" data-tool="rabbit" onclick="selectTool('rabbit')">🐾</button>
          <button class="tool-btn" data-tool="carrot" onclick="selectTool('carrot')">🍽️</button>
          <button class="tool-btn" data-tool="wall" onclick="selectTool('wall')">🧱</button>
          <button class="tool-btn" data-tool="erase" onclick="selectTool('erase')">🧽</button>
        </div>
      </div>
      <div class="tool-group" id="dirGroup">
        <h3>اتجاه البداية</h3>
        <div class="tool-buttons">
          <button class="dir-btn" data-dir="0" onclick="setDir(0)">→</button>
          <button class="dir-btn" data-dir="1" onclick="setDir(1)">↓</button>
          <button class="dir-btn" data-dir="2" onclick="setDir(2)">←</button>
          <button class="dir-btn" data-dir="3" onclick="setDir(3)">↑</button>
        </div>
      </div>
      <div class="editor-inputs">
        <label>اسم المستوى:</label>
        <input type="text" id="editorTitle" placeholder="مثال: متاهة بابا" maxlength="30">
        <label>تلميح (اختياري):</label>
        <input type="text" id="editorHint" placeholder="فكر قبل ما تمشي" maxlength="60">
      </div>
      <div class="editor-actions">
        <button class="save-btn" onclick="saveLevel()">💾 حفظ</button>
        <button class="clear-btn" onclick="clearEditor()">🔄 مسح</button>
        <button class="back-btn" onclick="closeEditor()">⬅️ رجوع</button>
      </div>
    </div>
  </div>
  <div style="margin-top:16px;padding:10px;background:#f8f9fa;border-radius:12px">
    <h3 style="margin:0 0 8px;font-size:14px;color:#2c3e50">📋 المستويات المخصصة</h3>
    <div id="customLevelsItems"></div>
  </div>
</div>
<script>
const THEMES = [
  { a:'🐰', f:'🥕', name:'أرنب' },
  { a:'🐱', f:'🐟', name:'قطة' },
  { a:'🐶', f:'🦴', name:'كلب' },
  { a:'🐵', f:'🍌', name:'قرد' },
  { a:'🐼', f:'🎋', name:'باندا' },
  { a:'🐻', f:'🍯', name:'دب' },
  { a:'🐭', f:'🧀', name:'فأر' },
  { a:'🐷', f:'🌽', name:'خنزير' },
  { a:'🐔', f:'🌾', name:'دجاجة' },
  { a:'🐧', f:'🐟', name:'بطريق' },
  { a:'🦁', f:'🍖', name:'أسد' },
  { a:'🐘', f:'🥜', name:'فيل' },

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, dur, delay, type, vol) {
  if (delay === undefined) delay = 0;
  if (type === undefined) type = 'sine';
  if (vol === undefined) vol = 0.2;
  const ctx = initAudio();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(gain); gain.connect(ctx.destination);
  const s = ctx.currentTime + delay;
  osc.start(s);
  gain.gain.setValueAtTime(vol, s);
  gain.gain.exponentialRampToValueAtTime(0.001, s + dur);
  osc.stop(s + dur);
}
function sfxStep() {
  const ctx = initAudio();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.1);
}
function sfxBump() {
  const ctx = initAudio();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.18);
  gain.gain.setValueAtTime(0.25, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.2);
}
function sfxOutOfBounds() {
  const ctx = initAudio();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(400, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3);
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.3);
}
function playApplause() {
  const ctx = initAudio();
  const dur = 2.5, bufSize = ctx.sampleRate * dur;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    const t = i / bufSize, env = Math.exp(-t * 2) * (1 - Math.exp(-t * 20));
    data[i] = (Math.random() * 2 - 1) * env * 0.5;
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 1500; filter.Q.value = 0.8;
  const gain = ctx.createGain(); gain.gain.value = 0.4;
  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
}

function executeCommand(type) {
  const lv = levels[currentLevel];
  if (type === 'up' || type === 'down' || type === 'left' || type === 'right') {
    let newDir, ddx = 0, ddy = 0;
    if (type === 'right') { newDir = 0; ddx = 1; }
else if (type === 'down') { newDir = 1; ddy = 1; }
else if (type === 'left') { newDir = 2; ddx = -1; }
else if (type === 'up') { newDir = 3; ddy = -1; }
    rabbit.dir = newDir;
    const nx = rabbit.x + ddx, ny = rabbit.y + ddy;
    if (nx < 0 || nx > 4 || ny < 0 || ny > 4) { sfxOutOfBounds(); shakeRabbit(); feedbackEl.textContent = '🙈 خارج اللوحة!'; return 'fail'; }
    if (lv.walls.some(function(w) { return w.x === nx && w.y === ny; })) { sfxBump(); shakeRabbit(); feedbackEl.textContent = '🧱 فيه حاجز!'; return 'fail'; }
    sfxStep(); rabbit.x = nx; rabbit.y = ny;
    if (rabbit.x === lv.carrot.x && rabbit.y === lv.carrot.y) {
      renderBoard('لقيته! 🎉');
      const rEl = document.querySelector('.rabbit');
      if (rEl) rEl.classList.add('jump');
      return 'win';
    }
  } else if (type === 'jump') {
    const landX = rabbit.x + dx[rabbit.dir] * 2;
    const landY = rabbit.y + dy[rabbit.dir] * 2;
    if (landX < 0 || landX > 4 || landY < 0 || landY > 4) { sfxOutOfBounds(); shakeRabbit(); feedbackEl.textContent = '🙈 خارج اللوحة!'; return 'fail'; }
    if (lv.walls.some(function(w) { return w.x === landX && w.y === landY; })) { sfxBump(); shakeRabbit(); feedbackEl.textContent = '🧱 نزلت على حاجز!'; return 'fail'; }
    sfxStep(); playTone(700, 0.1, 0, 'sine', 0.15);
    rabbit.x = landX; rabbit.y = landY;
    if (rabbit.x === lv.carrot.x && rabbit.y === lv.carrot.y) {
      renderBoard('لقيته! 🎉');
      const rEl = document.querySelector('.rabbit');
      if (rEl) rEl.classList.add('jump');
      return 'win';
    }
  }
  renderBoard(); return 'ok';
}
function shakeRabbit() {
  setTimeout(function() {
    const r = document.querySelector('.rabbit');
    if (r) { r.classList.add('shake'); setTimeout(function() { r.classList.remove('shake'); }, 320); }
  }, 30);
}
function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }
async function runProgram() {
  if (isRunning) return;
  if (program.length === 0) { feedbackEl.textContent = '🤔 أضف أوامر أولاً!'; return; }
  initAudio(); isRunning = true; feedbackEl.textContent = '';
  resetRabbit(); await sleep(300);
  const speed = parseInt(speedInput.value);
  for (let i = 0; i < program.length; i++) {
    const cmd = program[i];
    for (let r = 0; r < cmd.repeat; r++) {
      const res = executeCommand(cmd.type);
      await sleep(speed);
      if (res === 'win') { isRunning = false; celebrate(); return; }
      if (res === 'fail') { isRunning = false; return; }
    }
  }
  isRunning = false;
}
async function stepProgram() {
  if (isRunning) return;
  if (program.length === 0) { feedbackEl.textContent = '🤔 أضف أوامر أولاً!'; return; }
  initAudio();
  if (stepIndex >= program.length) { feedbackEl.textContent = 'انتهت الأوامر.'; return; }
  isRunning = true;
  const cmd = program[stepIndex];
  let won = false;
  for (let r = 0; r < cmd.repeat; r++) {
    const res = executeCommand(cmd.type);
    if (res === 'win') { won = true; break; }
    if (res === 'fail') break;
  }
  stepIndex++;
  if (won) { feedbackEl.textContent = '🎉 برافو!'; celebrate(); }
  isRunning = false;
}

function selectTool(t) {
  currentTool = t;
  document.querySelectorAll('.tool-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.tool === t); });
  document.getElementById('dirGroup').style.opacity = t === 'rabbit' ? '1' : '0.5';
}
function setDir(d) {
  editorRabbitDir = d;
  document.querySelectorAll('.dir-btn').forEach(function(b) { b.classList.toggle('active', parseInt(b.dataset.dir) === d); });
  renderEditorGrid();
}
function renderEditorGrid() {
  const g = document.getElementById('editorGrid');
  const t = THEMES[editorTheme];
  g.innerHTML = '';
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
    const c = document.createElement('div');
    c.className = 'editor-cell';
    const v = editorGrid[y][x];
    if (v === 'rabbit') {
      c.textContent = t.a;
      const a = document.createElement('div');
      a.className = 'arrow'; a.textContent = dirSymbols[editorRabbitDir];
      c.appendChild(a);
    } else if (v === 'carrot') { c.classList.add('carrot'); c.textContent = t.f; }
    else if (v === 'wall') { c.classList.add('wall'); c.textContent = '🧱'; }
    c.onclick = (function(xx, yy) { return function() { placeInCell(xx, yy); }; })(x, y);
    g.appendChild(c);
  }
}
function placeInCell(x, y) {
  if (currentTool === 'erase') { if (editorGrid[y][x] !== 'rabbit') editorGrid[y][x] = null; renderEditorGrid(); return; }
  if (currentTool === 'rabbit') {
    for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 5; xx++) if (editorGrid[yy][xx] === 'rabbit') editorGrid[yy][xx] = null;
    editorGrid[y][x] = 'rabbit';
  } else if (currentTool === 'carrot') {
    for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 5; xx++) if (editorGrid[yy][xx] === 'carrot') editorGrid[yy][xx] = null;
    if (editorGrid[y][x] === 'rabbit') editorGrid[y][x] = null;
    editorGrid[y][x] = 'carrot';
  } else if (currentTool === 'wall') {
    if (editorGrid[y][x] === 'rabbit' || editorGrid[y][x] === 'carrot') return;
    editorGrid[y][x] = 'wall';
  }
  renderEditorGrid();
}
function clearEditor() {
  if (!confirm('متأكد إنك عايز تمسح الشبكة؟')) return;
  initEditorGrid(); renderThemeButtons(); renderEditorGrid();
}
function saveLevel() {
  let r = null, c = null;
  const w = [];
  for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) {
    const v = editorGrid[y][x];
    if (v === 'rabbit') r = {x:x, y:y};
    else if (v === 'carrot') c = {x:x, y:y};
    else if (v === 'wall') w.push({x:x, y:y});
  }
  if (!r) { alert('لازم تحط الحيوان'); return; }
  if (!c) { alert('لازم تحط الأكل'); return; }
  const t = document.getElementById('editorTitle').value.trim();
  const h = document.getElementById('editorHint').value.trim();
  customLevels.push({
    title: t || ('مستوى مخصص ' + (customLevels.length + 1)),
    hint: h || 'مستوى من صنعك!',
    theme: editorTheme,
    start: { x: r.x, y: r.y, dir: editorRabbitDir },
    carrot: { x: c.x, y: c.y },
    walls: w, isCustom: true
  });
  saveCustomLevels(); rebuildLevels(); renderCustomLevelsList(); renderProgressBar();
  alert('✅ تم حفظ المستوى!');
  document.getElementById('editorTitle').value = '';
  document.getElementById('editorHint').value = '';
}
function renderCustomLevelsList() {
  const el = document.getElementById('customLevelsItems');
  el.innerHTML = '';
  if (customLevels.length === 0) {
    el.innerHTML = '<div style="color:#7f8c8d;font-size:13px;text-align:center;padding:8px;">لسه مفيش مستويات مخصصة</div>';
    return;
  }
  for (let idx = 0; idx < customLevels.length; idx++) {
    const lv = customLevels[idx];
    const t = THEMES[lv.theme || 0];
    const it = document.createElement('div');
    it.style.cssText = 'display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px';
    it.innerHTML = '<span>' + t.a + ' مستوى ' + (builtInLevels.length + idx + 1) + ': ' + lv.title + '</span>';
    const b = document.createElement('button');
    b.textContent = '🗑️';
    b.style.cssText = 'background:#e74c3c;color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer';
    b.onclick = (function(i) { return function() { deleteCustomLevel(i); }; })(idx);
    it.appendChild(b);
    el.appendChild(it);
  }
}
function deleteCustomLevel(idx) {
  if (!confirm('متأكد؟')) return;
  const g = builtInLevels.length + idx;
  customLevels.splice(idx, 1);
  saveCustomLevels();
  savedProgress.completedLevels = savedProgress.completedLevels.filter(function(i) { return i !== g; }).map(function(i) { return i > g ? i - 1 : i; });
  rebuildLevels();
  if (currentLevel >= levels.length) currentLevel = Math.max(0, levels.length - 1);
  saveProgress(); renderCustomLevelsList(); renderProgressBar(); updateTopBar();
}

window.addCommand = addCommand;
window.addRepeat = addRepeat;
window.runProgram = runProgram;
window.stepProgram = stepProgram;
window.resetLevel = resetLevel;
window.nextLevel = nextLevel;
window.closeWinScreen = closeWinScreen;
window.openEditor = openEditor;
window.closeEditor = closeEditor;
window.selectTool = selectTool;
window.setDir = setDir;
window.clearEditor = clearEditor;
window.saveLevel = saveLevel;
window.confirmResetProgress = confirmResetProgress;
window.showCode = showCode;

loadCustomLevels(); rebuildLevels(); loadProgress();
if (savedProgress.currentLevel >= levels.length) savedProgress.currentLevel = 0;
loadLevel(savedProgress.currentLevel || 0);
if (!localStorage.getItem(SAVE_KEY)) saveProgress();
</script>
</body>
</html>
